[package]
name = "symsync"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "symsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 微博内部版。默认关闭：公开版就是不加任何 feature 的默认构建，
# 内部版用 `--features weiboap`（见 Makefile 与 docs/specs 的双版本方案）。
weiboap = ["symsync-core/weiboap"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symsync-core = { path = "../crates/core" }
symsync-gateway = { path = "../crates/gateway" }
tokio = { version = "1", features = ["sync"] }
notify = "6"
notify-debouncer-mini = "0.4"
# 应用内更新：updater 查清单、下载、装；process 负责装完重启自己。
# 两个都只有桌面端有实现——这个应用本来就只有桌面端（托盘、launchd、软链）。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

# 托盘面板的原生窗口细节（去掉弹出时从中心放大的动画、圆角）：tauri 自己就依赖这两个，版本随它
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSColor", "NSGraphics", "NSEvent", "NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
# 托盘面板换成不激活应用的 NSPanel：点图标、点面板里的控件都不把应用（和它的主窗口）提到前台
tauri-nspanel = "2.1"

[dev-dependencies]
tempfile = "3"
