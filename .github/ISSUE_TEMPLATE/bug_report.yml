name: 报告问题
description: Sophia 出了问题、或行为不对
title: "[问题] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Sophia 版本
      description: 设置「关于」里 `版本` 那一行
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本
      description: 「关于本机」里的版本
      placeholder: macOS 15.1
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 看到了什么、期望是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      placeholder: |
        1. 打开…
        2. 点…
        3. 出现…
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 日志在 `~/Library/Logs/com.zhengjiaqiao.sophia/`，粘贴最近几十行即可。密钥和路径已去掉
      render: text
