name: CI
# 私有仓库（sophia-dev）的 Actions 分钟要计费（2026-10-08 免费额度用完、作业停了），省分钟的三处：
# 开发仓库只在 PR 上跑，合进 main 后不再重跑一遍（下面 core、site 的 if）；只改 docs/ 的 PR 不跑
# （tests 会读的两份 DESIGN 例外）；同一个 PR 推了新提交，取消上一次还没跑完的。
# 公开仓库（sophia）没有 PR，只收同步提交，照旧在 push 到 main 时跑全部三个作业（公开仓库不计费）
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "docs/DESIGN.md"
      - "docs/DESIGN-components.md"
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "docs/DESIGN.md"
      - "docs/DESIGN-components.md"
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  core:
    if: github.event_name == 'pull_request' || github.repository == 'zhengjiaqiao/sophia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 固定版本：@stable 会随上游前进，新版 clippy 新增的 lint 会让本来绿的 CI 突然变红；
      # 开发机上的 clippy 往往更旧，本地零警告不代表 CI 通过。升级时一起改两处并本地复跑。
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - run: cargo test -p sophia-core
      - run: cargo test -p sophia-gateway
      - run: cargo clippy -p sophia-core -p sophia-gateway --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      # 前端这一半不需要 macOS：类型检查、纯逻辑测试（含文案目录、术语表、模块加载的检查）、prettier。
      # 开发仓库不跑 app 作业，没有这几步就只剩本机 make test 兜着（2026-10-05 retro）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.ts
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      # shell 脚本：变量名后紧跟中文（bash 3.2 会读进变量名，2026-10-08 retro）
      - run: node scripts/lint-shell.mjs
  # 官网（website/，Astro 静态站）：纯逻辑与构建产物测试、构建 + 构建检查（文案缺键、残留占位符、白名单外域名等）。
  # 不需要 Rust 也不需要 macOS，单独一个作业，和 core 并行
  site:
    if: github.event_name == 'pull_request' || github.repository == 'zhengjiaqiao/sophia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test-site build-site
  # macOS 机器在私有仓库按分钟计费（约为 Linux 的 10 倍），只在公开仓库跑；
  # 开发仓库（sophia-dev，私有）里提交前靠本机 `make test` 兜住这一段
  app:
    if: github.repository == 'zhengjiaqiao/sophia'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 版本号三处一致。发布那天才发现对不上，就已经是打了 tag 之后的事了
      - run: node packaging/check-version.mjs
      - run: npm run build
      - run: cargo check --workspace
      - run: cargo test -p sophia --lib
