name: Release

# 打 tag 就发布：v0.2.0 → 构建两个架构的 macOS 包、生成更新清单、挂上 GitHub Release，再同步到腾讯云 COS、更新 Homebrew tap。
# workflow_dispatch 是排练：一样地构建、一样地签名，但不建 Release，产物落在 workflow artifacts 里。
# 排练能验掉除了「Release 资产名和 latest.json 内容」之外的全部环节。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  # CI 里的 Rust 版本与 ci.yml 钉在一起，升级时两个文件一起改
  RUST_VERSION: "1.98.0"

jobs:
  # 先把会让发布半途而废的事全部问清楚，再去花二十分钟编译。
  # 这里每一条失败都直接说缺什么、去哪儿补，不静默跳过。
  guard:
    # 只在公开仓库发布：更新地址与 Homebrew 都指向它的 Releases，私有的开发仓库
    # 打了 tag 也不在这里构建（macOS 分钟要计费）。后面的任务都 needs 它，一起跳过
    if: github.repository == 'zhengjiaqiao/sophia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 版本号只有一个来源（src-tauri/tauri.conf.json）。tag 与它对不上就停，
      # 否则安装包叫一个版本、更新清单叫另一个版本，更新器会一直认为有新版。
      - name: 版本号三处一致，且与 tag 对齐
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node packaging/check-version.mjs --tag "${{ github.ref_name }}"
          else
            node packaging/check-version.mjs
          fi

      # 公钥是编进应用里的，用来验下载回来的包是不是我们签的。
      # 它空着的话应用装得上，但永远更新不了——而且是静默失效，所以在这里拦。
      - name: 更新用的公钥已经填进配置
        run: |
          pubkey=$(node -e 'process.stdout.write(require("./src-tauri/tauri.conf.json").plugins?.updater?.pubkey ?? "")')
          if [ -z "$pubkey" ]; then
            echo "::error::src-tauri/tauri.conf.json 的 plugins.updater.pubkey 是空的。"
            echo "::error::先在本机跑 npm run tauri signer generate -- -w ~/.tauri/sophia.key，"
            echo "::error::把 ~/.tauri/sophia.key.pub 的内容（不是路径）填进 pubkey，提交后再打 tag。"
            exit 1
          fi

      # 私钥不在仓库里，只能来自 secret。没有它就签不出 .sig，
      # 更新器会拒绝安装——所以这里宁可红，也不出一个悄悄不能更新的包。
      - name: 更新用的私钥已经配成 secret
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::缺少 secret TAURI_SIGNING_PRIVATE_KEY。"
            echo "::error::本机 npm run tauri signer generate -- -w ~/.tauri/sophia.key 生成密钥对，"
            echo "::error::把 ~/.tauri/sophia.key（私钥）整个内容存成仓库 secret TAURI_SIGNING_PRIVATE_KEY，"
            echo "::error::生成时设的密码存成 secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD（没设密码就存空值）。"
            echo "::error::私钥不要提交进仓库。"
            exit 1
          fi

      # Apple 签名与公证（spec 2026-10-05-signing-notarization R2）：七个 secret 缺一个就停，逐项说缺什么。
      # 不再退回临时签名：空字符串交给打包工具会被当成「有证书」，连临时签名都可能出不来；
      # 而且排练本来就是为了验签名和公证，缺了它们排练也没有意义
      - name: Apple 签名与公证的 secret 都已配好
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          check() {
            if [ -z "$(printenv "$1")" ]; then
              echo "::error::缺少 secret $1：$2"
              missing=1
            fi
          }
          check APPLE_CERTIFICATE "Developer ID Application 证书导出的 .p12，base64 之后的整段文字"
          check APPLE_CERTIFICATE_PASSWORD "导出 .p12 时设的密码"
          check APPLE_SIGNING_IDENTITY "security find-identity -v -p codesigning 里的名字，形如 Developer ID Application: 名字 (TEAMID)"
          check KEYCHAIN_PASSWORD "CI 临时钥匙串的密码，任意随机值"
          check APPLE_ID "开发者账号的 Apple ID 邮箱"
          check APPLE_PASSWORD "account.apple.com 生成的 App 专用密码"
          check APPLE_TEAM_ID "developer.apple.com/account 的 Membership details 里的 Team ID"
          if [ "$missing" = 1 ]; then
            echo "::error::怎么建证书、怎么设这几个 secret，见 packaging/README.md「3. Apple 签名与公证」。"
            exit 1
          fi

      # 上报与反馈的接收服务地址（发布前评估 M19）：空着的话，公开版会悄悄变成「没有上报、没有反馈入口」的包，
      # 而且这里不检查就没人会发现。只在公开仓库发版，所以变量也只配在公开仓库
      - name: 接收服务地址已配成仓库变量
        env:
          SOPHIA_REPORT_URL: ${{ vars.SOPHIA_REPORT_URL }}
        run: |
          if [ -z "$SOPHIA_REPORT_URL" ]; then
            echo "::error::仓库变量 SOPHIA_REPORT_URL 是空的：公开版会没有自动上报和「反馈问题」。"
            echo "::error::gh variable set SOPHIA_REPORT_URL -R zhengjiaqiao/sophia --body 'https://api.sophiakit.workers.dev'（部署见 server/README.md）。"
            exit 1
          fi

      # 国内线路（issue #263）：转正之后要把产物传到腾讯云 COS。缺了这几样，那一步要等二十分钟编译完才红，
      # 而 Release 那时已经公开、国内线路停在旧版，所以在这里先拦
      - name: COS 的密钥与桶名已配好
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          missing=0
          for name in COS_SECRET_ID COS_SECRET_KEY COS_BUCKET COS_REGION; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::缺少 ${name}（密钥 COS_SECRET_ID、COS_SECRET_KEY，仓库变量 COS_BUCKET、COS_REGION）"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::在本机跑向导 scripts/setup-cos.sh 写进 zhengjiaqiao/sophia（见 packaging/README.md「5. 腾讯云 COS」）。"
            exit 1
          fi

  # 先建一个草稿 Release 拿到 id，两个架构的构建往同一个 id 上挂产物，
  # tauri-action 会把各自的 latest.json 合并进同一份清单。
  # 排练（workflow_dispatch）不建 Release，这一步整个跳过，输出为空。
  draft:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/__VERSION__/${version}/g" packaging/release-body.md > /tmp/body.md
          id=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f name="Sophia ${version}" \
            -F draft=true \
            -F prerelease=false \
            --field body=@/tmp/body.md \
            --jq .id)
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    runs-on: macos-latest
    # 公证通常几分钟，首次可能排队更久；超时就失败，草稿 Release 不公开，重跑即可（R5）
    timeout-minutes: 60
    strategy:
      # 两个架构串行跑。并行时两边都要改同一份 latest.json，后写的会盖掉先写的，
      # 于是清单里只剩一个架构——发布一次才看得出来的那种错，不值得为省十分钟冒。
      max-parallel: 1
      fail-fast: false
      matrix:
        # 不做 universal 包：更新清单本来就按 darwin-aarch64 / darwin-x86_64 分开列，
        # 分架构出包让每台机器只下自己那一半，universal 会让所有人下双份。
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        variant:
          - name: public
            features: ""
            publish: true
          # 内部版的口子：Cargo feature 名定下来之后，把下面四行的注释去掉即可。
          # publish: false ⇒ 不往公开 Release 上挂，只落在 workflow artifacts 里。
          # - name: weibo
          #   features: weiboap
          #   publish: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant.name }}
      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 更新包的签名。没有它 tauri build 会直接失败——这正是我们要的。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple 签名 + 公证（spec 2026-10-05-signing-notarization）：有证书就导入临时钥匙串签名，
          # 有 Apple ID 三件套就提交公证并钉票据。七个都由 guard 保证非空
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 自动上报的接收服务地址（spec 2026-10-04-reporting-feedback R9），编译期注入（src-tauri/src/report.rs 的
          # option_env!）。只给公开版：内部版本来就不编上报模块，这里也不给地址。仓库变量（Settings → Variables）
          # 没设或为空＝这个包不上报
          SOPHIA_REPORT_URL: ${{ matrix.variant.name == 'public' && vars.SOPHIA_REPORT_URL || '' }}
        with:
          # 空字符串＝不往 Release 上挂，只构建（排练，以及内部版）
          releaseId: ${{ (matrix.variant.publish && needs.draft.outputs.releaseId) || '' }}
          uploadUpdaterJson: ${{ matrix.variant.publish }}
          uploadWorkflowArtifacts: true
          # tauri-action 每种安装包（dmg、app）各传一个 artifact，名字必须带 [bundle]，
          # 否则第二个撞名 409、整个架构判失败（2026-10-05 排练 run 37309681257）
          workflowArtifactNamePattern: sophia-${{ matrix.variant.name }}-${{ matrix.target }}-[bundle]
          retryAttempts: 2
          # createUpdaterArtifacts 只在发布这条路上打开（packaging/updater.conf.json 合并进配置）：
          # 它会要求签名私钥，而本机 make build 不该为了出一个 debug 包去配密钥。
          # 用绝对路径，不用内联 JSON —— 内联 JSON 要穿过 YAML 和 action 的参数切分两道引号规则。
          args: >-
            --target ${{ matrix.target }}
            --config ${{ github.workspace }}/packaging/updater.conf.json
            ${{ matrix.variant.features && format('--features {0}', matrix.variant.features) || '' }}

      # 核对产物（spec 2026-10-05-signing-notarization R3）：签名完整、已公证、票据已钉上，缺一样
      # 这个架构就算失败。CI 上的文件没有 quarantine 属性，绿了也不等于用户双击打得开
      - name: 核对签名与公证
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          packaging/verify-signature.sh "$bundle/macos/Sophia.app" "$bundle"/dmg/*.dmg

      # 更新包的签名要写着这一版的版本号（issue #262）：应用开了 requireSignedVersion，签名里没有版本号或
      # 版本号对不上，已装的客户端会拒绝这次更新。版本号由 Tauri CLI 2.12 起在 tauri build 时写进可信注释
      - name: 更新包签名里写着版本号
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          sig="target/${{ matrix.target }}/release/bundle/macos/Sophia.app.tar.gz.sig"
          comment=$(base64 --decode < "$sig" | sed -n 's/^trusted comment: //p')
          echo "可信注释：$comment"
          if ! printf '%s' "$comment" | tr '\t' '\n' | grep -qx "version:${version}"; then
            echo "::error::$sig 的可信注释里没有 version:${version}。检查 package.json 里的 @tauri-apps/cli 是否不低于 2.12。"
            exit 1
          fi

      # 留存符号文件（spec 2026-10-04-local-diagnostics R6）：发布档把行号表另存成 dSYM、不随包发，
      # runner 用完即丢，所以在这里取出来存成 artifact。用户发来崩溃记录时，按版本与架构下回来对行号。
      # target/<架构>/release/sophia.dSYM 是指向 deps/sophia-<哈希>.dSYM 的软链：cp -RL 取实体、改固定名
      - name: 取出 dSYM
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          target='${{ matrix.target }}'
          name="sophia-${version}-${target%%-*}-${{ matrix.variant.name }}.dSYM"
          mkdir -p dsym
          cp -RL "target/${target}/release/sophia.dSYM" "dsym/${name}"
          dwarfdump --uuid "dsym/${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: sophia-dsym-${{ matrix.variant.name }}-${{ matrix.target }}
          path: dsym/
          if-no-files-found: error
          # 公开仓库的上限就是 90 天；要更久，发版后按 packaging/README.md 下回来另存
          retention-days: 90

  # 两个架构都挂上去了，latest.json 也合并完了，才把草稿转正。
  # 中途失败就把草稿留在那儿：它不可见，改完重打同一个 tag 之前先手工删掉。
  publish:
    needs: [draft, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${{ needs.draft.outputs.releaseId }}" \
            -F draft=false

  # 转正之后把产物与改写过地址的清单传到腾讯云 COS（issue #263），步骤在 cos-sync.yml，那边也有手动入口。
  # 排练不建 Release，publish 跳过，这一步跟着跳过。它红了不回滚 Release：按报错修好，再用手动入口对同一个 tag 重跑
  cos:
    needs: publish
    if: github.event_name == 'push'
    uses: ./.github/workflows/cos-sync.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}

  # 转正之后把 cask 推到 Homebrew tap（spec #193），步骤在 homebrew-cask.yml，那边也有手动入口。
  # 排练不建 Release，publish 跳过，这一步跟着跳过、不推 tap。
  # 它红了不回滚 Release（已经公开了）：按报错补好令牌之类，再用手动入口对同一个 tag 重跑
  homebrew:
    needs: publish
    if: github.event_name == 'push'
    uses: ./.github/workflows/homebrew-cask.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
