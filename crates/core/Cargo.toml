[package]
name = "symsync-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
thiserror = "2"
pathdiff = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "2"

[dev-dependencies]
tempfile = "3"
