[package]
name = "sophia-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[features]
# 微博内部版：WeiboAP harness 及其 MCP 适配。默认关闭，公开版构建什么都不用加；
# 内部版显式 `--features weiboap`。关掉时内部目录结构、数据库表名列名
# 在编译期就不会进入产物（harness 表分两份 `include_str!`）。
weiboap = ["rusqlite/backup"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
toml_edit = "0.25"
dirs = "7"
# 日志门面：core 只发日志，写到哪由宿主（src-tauri 装的 tauri-plugin-log）决定
log = "0.4"
pathdiff = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
trash = { version = "5", default-features = false }
# 发现与安装（market/）：codeload 的 tar.gz 解包、按 git 规则算 tree SHA。只做纯计算，不联网
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
# 自动上报的安装 ID（随机 UUID v4）；与 tauri 等用的是同一份 uuid，不新增依赖
uuid = { version = "1.26", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
junction = "2"
