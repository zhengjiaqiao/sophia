[package]
name = "sophia-gateway"
version = "0.1.0"
edition = "2021"
description = "模型网关：本机路由（在 Sophia 进程里运行）、协议转换。不依赖 tauri。"

[dependencies]
sophia-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process"] }
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "http1"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
futures-util = "0.3.34"
ruzstd = "0.9.0"
sha2 = "0.11.0"
base64 = "0.23.1"
url = "2.5.8"
# 日志门面：写到哪由宿主决定（应用里是 tauri-plugin-log）
log = "0.4"

# 退出桌面应用走 NSRunningApplication.terminate（同 ⌘Q），见 `process::quit_app`
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
